services:
  blackout-trainer:
    build: .
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # Edit this path to point to your Unity Linux build directory
      - /path/to/blackout_build:/unity_build:ro
    network_mode: host
    # Edit this to run your training script
    command: python train.py

  blackout-competition:
    build: .
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # Edit this path to point to your Unity Linux build directory
      - /path/to/blackout_build:/unity_build:ro
    network_mode: host
    # Edit this to run your competition script
    command: python run_competition.py

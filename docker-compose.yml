services:
  blackout-trainer:
    build: .
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # Edit this path to point to your Unity Linux build directory
      - /path/to/blackout_build:/unity_build:ro
    network_mode: host
    # Override CMD to run a specific script:
    #   docker compose run blackout-trainer python my_trainer.py

  blackout-competition:
    build: .
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # Edit this path to point to your Unity Linux build directory
      - /path/to/blackout_build:/unity_build:ro
    network_mode: host
    # Runs with 1280x720 virtual display for FFmpeg capture
    # Override CMD:
    #   docker compose run blackout-competition python run_competition.py
